# Render Blueprint for the CyberGuard AI API.
# Render dashboard → New → Blueprint → pick this repo. You'll be asked for the
# values marked `sync: false`. The database lives on Neon (free, doesn't expire).
services:
  - type: web
    name: cyberguard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false        # paste your Neon connection string
      - key: CORS_ALLOWED_ORIGINS
        sync: false        # e.g. https://cyberguard-ai.vercel.app
      - key: GEMINI_API_KEY
        sync: false        # from https://aistudio.google.com/apikey
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: WEB_CONCURRENCY
        value: "2"
